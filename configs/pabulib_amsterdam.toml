[dataset]
path = "data/Netherlands_Amsterdam_2020_Centrum.pb"

[experiment]
project_counts = [5, 10, 20, 30, 40, 50, 75, 85]
subprofile_count = 20
voters_per_subprofile = 5
utility_profiles_per_subprofile = 5
utility_witness_mix = 0.75
master_seed = 42
max_utility_cuts = 500

[analysis]
bootstrap_resamples = 2000
confidence_level = 0.95

[output]
directory = "outputs/pabulib"
